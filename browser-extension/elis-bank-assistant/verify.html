<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review transfer verification</title>
  <link rel="stylesheet" href="verify.css">
</head>
<body>
  <main>
    <p class="profile" id="profile"></p>
    <section class="summary" aria-label="Transfer details">
      <div class="route"><div><span>From</span><strong id="from">—</strong></div><b aria-hidden="true">→</b><div><span>To</span><strong id="to">—</strong></div></div>
      <div class="amount"><span>Amount</span><strong id="amount">—</strong></div>
      <div class="memo"><span>Memo</span><strong id="memo">—</strong></div>
    </section>
    <p class="note">Read both account histories to confirm this transfer. No money moves.</p>
    <p id="status" role="status" aria-live="polite">Loading review…</p>
    <footer><button id="cancel" type="button">Cancel</button><button id="approve" type="button" disabled>Check completion</button></footer>
  </main>
  <script type="module" src="verify.js"></script>
</body>
</html>
